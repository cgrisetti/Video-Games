<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Hop</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        color: white;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75), 0 0 10px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }
      #score,
      #timer {
        font-size: 1.4rem;
        font-weight: 700;
      }
      #help {
        margin-top: 6px;
        opacity: 0.85;
      }
      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 28px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-size: 1.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="score"></div>
      <div id="timer"></div>
      <div id="help">WASD or arrow keys to move · Space to jump over rocks and logs · R to restart · Dodge the inch worms!</div>
    </div>
    <div id="message" hidden></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
