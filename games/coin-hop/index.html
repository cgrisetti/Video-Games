<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Hop</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        color: white;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75), 0 0 10px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }
      #score,
      #timer {
        font-size: 1.4rem;
        font-weight: 700;
      }
      #help,
      #controller-help {
        margin-top: 6px;
        opacity: 0.85;
      }
      /* The Top 10 board: a page from a storybook, with a twig, leaves and a raspberry on top. */
      #scoreboard {
        --paper: #fbf4df;
        --paper-edge: #ecdcb2;
        --ink: #4a3826;
        --ink-soft: #7a6448;
        --frame: #8b6a43;
        --moss: #6e9150;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: min(360px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 14px 24px 30px;
        color: var(--ink);
        font-family: Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
        text-align: center;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.6), transparent 40%),
          radial-gradient(circle at 88% 92%, rgba(205, 172, 110, 0.3), transparent 45%),
          radial-gradient(ellipse at center, var(--paper) 58%, var(--paper-edge) 100%);
        border: 2px solid var(--frame);
        border-radius: 16px;
        box-shadow: 0 0 0 5px #f6ecd2, 0 0 0 7px var(--moss), 0 16px 40px rgba(45, 32, 12, 0.45);
      }
      .sprig {
        display: block;
        width: 116px;
        height: 34px;
        margin: 0 auto;
      }
      #scoreboard h2 {
        margin: 0;
        font-family: Luminari, Palatino, 'Palatino Linotype', Georgia, serif;
        font-size: 1.5rem;
        font-weight: normal;
        color: #5a3b1f;
      }
      #result {
        margin: 4px 0 10px;
        font-style: italic;
        color: var(--ink-soft);
      }
      #scores {
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }
      #scores li {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 1px 8px;
        border-radius: 8px;
      }
      #scores li + li {
        border-top: 1px dashed rgba(139, 106, 67, 0.25);
      }
      #scores .rank {
        flex: none;
        width: 22px;
        height: 22px;
        line-height: 22px;
        border-radius: 50%;
        font-size: 0.8rem;
        text-align: center;
        color: var(--ink-soft);
      }
      /* The top three wear the gnome's colors: hat red, tunic blue and leaf green. */
      #scores li:nth-child(1) .rank {
        background: #c8302a;
        color: #fff6e8;
      }
      #scores li:nth-child(2) .rank {
        background: #2d6cb5;
        color: #f3f7ff;
      }
      #scores li:nth-child(3) .rank {
        background: #5f8a46;
        color: #f4fbe9;
      }
      #scores .name {
        flex: 1;
        overflow: hidden;
        white-space: pre;
        text-overflow: ellipsis;
      }
      #scores .time {
        flex: none;
        font-variant-numeric: tabular-nums;
        color: #5a3b1f;
      }
      #scores .empty .name,
      #scores .empty .time {
        color: rgba(122, 100, 72, 0.45);
      }
      #scores .yours {
        background: rgba(244, 196, 76, 0.38);
      }
      #scores input {
        flex: 1;
        min-width: 0;
        padding: 2px 4px;
        border: none;
        border-bottom: 1.5px dashed var(--frame);
        border-radius: 4px 4px 0 0;
        background: rgba(255, 255, 255, 0.6);
        color: inherit;
        font: inherit;
        outline: none;
      }
      #scores input:focus {
        border-bottom-style: solid;
        background: #fffdf6;
      }
      #scores .save {
        flex: none;
        padding: 1px 8px;
        border: 1px solid var(--frame);
        border-radius: 10px;
        background: #f6ecd2;
        color: var(--ink);
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .again {
        margin: 12px 0 0;
        font-size: 0.92rem;
        color: var(--ink-soft);
      }
      .again kbd {
        padding: 0 6px;
        border: 1px solid var(--frame);
        border-radius: 4px;
        background: #fffaf0;
        font-family: inherit;
      }
      #reset-scores {
        position: absolute;
        right: 10px;
        bottom: 6px;
        padding: 2px 4px;
        border: none;
        background: none;
        color: rgba(122, 100, 72, 0.7);
        font: inherit;
        font-size: 0.68rem;
        text-decoration: underline dotted;
        cursor: pointer;
      }
      #reset-scores:hover,
      #reset-scores:focus-visible {
        color: #a5382b;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="score"></div>
      <div id="timer"></div>
      <div id="help">WASD or arrow keys to move · Space to jump · F to swing your stick · R to restart · Dodge (or bonk) the inch worms!</div>
      <div id="controller-help" hidden>Controller: left stick or D-pad to move · ✕ to jump · □ to swing · Options to restart</div>
    </div>
    <section id="scoreboard" hidden>
      <svg class="sprig" viewBox="0 0 120 36" aria-hidden="true">
        <path d="M8 27 C 35 15, 85 15, 112 27" fill="none" stroke="#7a5230" stroke-width="2" stroke-linecap="round" />
        <ellipse cx="27" cy="17" rx="10" ry="4.5" transform="rotate(-28 27 17)" fill="#5f8a46" />
        <ellipse cx="41" cy="26" rx="8.5" ry="4" transform="rotate(22 41 26)" fill="#7ea55c" />
        <ellipse cx="93" cy="17" rx="10" ry="4.5" transform="rotate(28 93 17)" fill="#5f8a46" />
        <ellipse cx="79" cy="26" rx="8.5" ry="4" transform="rotate(-22 79 26)" fill="#7ea55c" />
        <g fill="#c8325f" stroke="#9e2049" stroke-width="0.6">
          <circle cx="57" cy="17" r="3.2" />
          <circle cx="63" cy="17" r="3.2" />
          <circle cx="54" cy="22" r="3.2" />
          <circle cx="60" cy="22" r="3.2" />
          <circle cx="66" cy="22" r="3.2" />
          <circle cx="57" cy="27" r="3.2" />
          <circle cx="63" cy="27" r="3.2" />
          <circle cx="60" cy="31.5" r="3" />
        </g>
        <path d="M60 14 L54 11 L58 10 L60 6 L62 10 L66 11 Z" fill="#4e9a3a" />
      </svg>
      <h2>Top 10 Raspberry Pickers</h2>
      <p id="result"></p>
      <ol id="scores"></ol>
      <p class="again">Press <kbd>R</kbd> or <kbd>Options</kbd> to play again</p>
      <button id="reset-scores" type="button">Reset leaderboard</button>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
