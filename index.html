<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Games</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #1d1f2b;
        color: #f4f4f8;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        margin-top: 0;
      }
      ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      a {
        display: block;
        padding: 16px 20px;
        border-radius: 10px;
        background: #2c2f42;
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        background: #3a3e57;
      }
      .name {
        font-size: 1.2rem;
        font-weight: 600;
      }
      .blurb {
        opacity: 0.75;
      }
      /* Lanternwood's card glows warm, like its lanterns. */
      a.lanternwood {
        display: flex;
        align-items: center;
        gap: 16px;
        background: linear-gradient(120deg, #2c3a2e, #3b3324);
        box-shadow: inset 0 0 0 1px rgba(255, 190, 100, 0.25);
      }
      a.lanternwood:hover {
        background: linear-gradient(120deg, #354a37, #4a3f2b);
      }
      a.lanternwood svg {
        flex: none;
        width: 48px;
        height: 48px;
        filter: drop-shadow(0 0 8px rgba(255, 180, 90, 0.55));
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Our Games</h1>
      <!-- One list item per game in games/. Add a new one whenever a game is created. -->
      <ul>
        <li>
          <a class="lanternwood" href="/games/lanternwood/">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 0 V5" stroke="#d9c3a0" stroke-width="1" />
              <path d="M12 4h8l1.5 3.5h-11z" fill="#6b4a32" />
              <ellipse cx="16" cy="17" rx="9.5" ry="10" fill="#f6a03f" />
              <ellipse cx="16" cy="17" rx="4.5" ry="10" fill="none" stroke="#c4691f" />
              <ellipse cx="13.5" cy="13.5" rx="3" ry="4" fill="#ffe6a8" opacity="0.85" />
              <path d="M10.5 26.5h11l-1.5 3h-8z" fill="#6b4a32" />
            </svg>
            <div>
              <div class="name">Lanternwood</div>
              <div class="blurb">
                A woodland arcade. Walk a little gnome down a lantern-lit path through the Glenn and go through its gates to
                play: Berry Rush, where rainbow inch worms chase you round a raspberry patch, and the Bramble Maze, a tall
                garden maze that's new every time.
              </div>
            </div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
